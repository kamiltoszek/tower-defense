<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Tower Defense</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0e15">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tower Defense">
<style>
  :root{
    --bg:#0b0e15; --panel:#131826; --panel2:#182034; --line:#253049;
    --text:#dfe6f3; --dim:#8b95ab; --gold:#f5c542; --accent:#4da3ff; --danger:#ff5252;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  /* solid root bg: iOS standalone paints area outside body (home-indicator strip) from html */
  html{ height:100%; background:var(--bg); }
  body{
    min-height:100%;
    background:radial-gradient(1200px 700px at 50% -10%, #131a2c, var(--bg));
    color:var(--text);
    font-family:'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
    display:flex; justify-content:center; align-items:flex-start;
    /* viewport-fit=cover + black-translucent status bar: keep HUD clear of notch/status bar/home indicator */
    padding:max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right))
            max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
    user-select:none; -webkit-user-select:none;
    -webkit-touch-callout:none; touch-action:manipulation; overscroll-behavior:none;
  }
  #wrap{ width:1206px; max-width:100%; }
  /* ---------- HUD ---------- */
  header#hud{
    display:flex; flex-wrap:wrap; align-items:center; gap:8px;
    background:var(--panel); border:1px solid var(--line); border-bottom:none;
    border-radius:12px 12px 0 0; padding:10px 14px; font-size:15px;
  }
   .brand{ font-weight:700; letter-spacing:.5px; margin-right:8px; font-size:16px; display:flex; align-items:center; gap:7px; }
   .brand svg{ width:19px; height:19px; color:#c7d2e8; }
   .stat{
     background:linear-gradient(180deg,#1b2337,#151c2e); border:1px solid var(--line); border-radius:8px;
     padding:6px 12px; white-space:nowrap; color:var(--dim); display:inline-flex; align-items:center;
   }
   .stat svg{ width:15px; height:15px; margin-right:6px; flex:none; }
   .stat b{ color:var(--text); font-size:15px; margin-left:1px; }
   .stat.gold svg{ color:var(--gold); }
   .stat.gold b{ color:var(--gold); }
   .stat.lives svg{ color:#ff8a80; }
   .stat.lives b{ color:#ff8a80; }
   .stat.lives.low b{ color:var(--danger); animation:blink .7s infinite; }
   .stat.lives.low svg{ color:var(--danger); }
   .stat.wave svg{ color:var(--accent); }
   .stat.wave b{ color:var(--accent); }
   .stat.dim{ color:var(--dim); font-size:13px; }
   @keyframes blink{ 50%{ opacity:.45; } }
   @keyframes pop{ 0%{ transform:scale(1); } 35%{ transform:scale(1.22); } 100%{ transform:scale(1); } }
   .stat.bump{ animation:pop .3s ease-out; }
   @keyframes hurtShake{
     0%,100%{ transform:translateX(0); }
     20%{ transform:translateX(-4px); } 40%{ transform:translateX(4px); }
     60%{ transform:translateX(-3px); } 80%{ transform:translateX(2px); }
   }
   .stat.lives.hurt{ animation:hurtShake .45s ease-out, blink .45s 2; }
   @keyframes waveFlash{
     0%{ box-shadow:0 0 0 1.5px var(--accent) inset, 0 0 14px rgba(77,163,255,.35); }
     100%{ box-shadow:none; }
   }
   .stat.wave.flash{ animation:waveFlash .6s ease-out; }
  header button{
    background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:8px; padding:8px 13px; font-size:14px; cursor:pointer;
    transition:background .12s, transform .05s; white-space:nowrap;
  }
  header button:hover:not(:disabled){ background:#202b45; }
  header button:active:not(:disabled){ transform:translateY(1px); }
  header button:disabled{ opacity:.45; cursor:default; }
   header button svg{ width:16px; height:16px; display:block; }
   header button.primary{ background:#1c4d2c; border-color:#2e7c43; color:#c8f5cf; font-weight:600; }
  header button.primary:hover:not(:disabled){ background:#226036; }
  header button.on{ background:#274b7a; border-color:#3f6fae; color:#cfe6ff; }
  .spacer{ flex:1; }
  /* ---------- Layout ---------- */
  main{ display:flex; }
  #stage{
    position:relative; flex:1 1 auto; min-width:0; height:auto;
    border:1px solid var(--line); border-left:none;
    display:flex; align-items:center; justify-content:center;
  }
  canvas{ display:block; background:#0e1320; cursor:crosshair; touch-action:none; }
  aside#panel{
    flex:0 0 230px; width:230px; background:var(--panel); border:1px solid var(--line); border-left:none;
    border-radius:0 12px 12px 0; padding:12px; display:flex; flex-direction:column; gap:10px;
    height:600px; overflow:hidden;
  }
  .ph{ font-size:11px; letter-spacing:1.5px; color:var(--dim); text-transform:uppercase; font-weight:700; }
  /* ---------- Shop ---------- */
  #shop{ display:flex; flex-direction:column; gap:7px; }
  .shop{
    display:grid; grid-template-columns:26px 1fr auto; grid-template-rows:auto auto;
    gap:1px 8px; align-items:center; text-align:left;
    background:var(--panel2); border:1px solid var(--line); border-radius:9px;
    padding:8px 10px; cursor:pointer; color:var(--text); font-family:inherit;
  }
  .shop:hover{ border-color:#3a4a75; }
  .shop.active{ border-color:var(--accent); background:#1a2440; box-shadow:0 0 0 1px var(--accent) inset; }
  .shop.cant{ opacity:.55; }
  .shop .chip{ grid-row:1/span 2; width:22px; height:22px; border-radius:6px; background:var(--c); box-shadow:0 0 8px var(--c); }
   .shop .name{ font-weight:600; font-size:14px; }
   .shop .key{
     margin-left:7px; font-size:10px; font-weight:700; line-height:1; padding:2.5px 5px;
     border-radius:4px; background:#0d1322; border:1px solid #2b3a5c; color:var(--dim);
   }
   .shop.active .key{ border-color:var(--accent); color:var(--accent); }
    .shop .desc{ grid-column:2/-1; font-size:11px; color:var(--dim); line-height:1.25; }
  .shop .cost{ grid-row:1/span 2; color:var(--gold); font-weight:700; font-size:13px; }
  /* ---------- Info / details ---------- */
  #info{
    flex:1; background:var(--panel2); border:1px solid var(--line); border-radius:9px;
    padding:11px; font-size:13px; overflow:auto; min-height:150px;
  }
  #info .tname{ font-weight:700; font-size:15px; margin-bottom:6px; }
  #info .tname .lv{ color:var(--gold); font-size:12px; font-weight:600; }
  #info .rows{ margin:6px 0 10px; }
  #info .rows div{ display:flex; justify-content:space-between; padding:3px 0; border-bottom:1px dashed #26314d; color:var(--dim); }
  #info .rows div b{ color:var(--text); font-weight:600; }
  #info .btns{ display:flex; flex-direction:column; gap:6px; }
  #info button{
    background:#202b45; border:1px solid #33436b; color:var(--text); border-radius:7px;
    padding:8px; cursor:pointer; font-family:inherit; font-size:13px;
  }
  #info button:hover:not(:disabled){ background:#28365a; }
  #info button:disabled{ opacity:.45; cursor:default; }
  #info button small{ color:var(--gold); margin-left:4px; }
  #info button.sell{ border-color:#5a3030; background:#332226; }
  #info .hint{ color:var(--dim); font-size:11.5px; margin-top:9px; line-height:1.4; }
  /* ---------- Overlay ---------- */
  #overlay{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(6,9,15,.86); backdrop-filter:blur(2px); z-index:5; overflow-y:auto;
  }
  #overlay.hidden{ display:none; }
    #ovBox{
      text-align:center; padding:32px 46px 34px; border:1px solid #33405e; border-radius:16px;
      background:linear-gradient(180deg, rgba(20,27,45,.96), rgba(10,14,25,.97));
      box-shadow:0 26px 70px rgba(0,0,0,.55); margin:auto;
    }
   #ovTitle{ font-size:38px; font-weight:800; letter-spacing:3px; margin-bottom:0; }
   #ovTitle.win{ color:#7ee08a; text-shadow:0 0 24px rgba(126,224,138,.5); }
   #ovTitle.lose{ color:#ff6b5e; text-shadow:0 0 24px rgba(255,90,80,.45); }
   .title-rule{ width:64px; height:3px; border-radius:2px; margin:12px auto 14px;
     background:linear-gradient(90deg, transparent, var(--gold), transparent); }
    #ovText{ color:var(--text); font-size:15px; margin-bottom:0; max-width:44ch; margin-left:auto; margin-right:auto; }
    #ovDiff{ display:flex; gap:8px; justify-content:center; margin:18px 0 4px; }
    .diff-btn{
      display:flex; flex-direction:column; align-items:center; gap:3px;
      min-width:118px; padding:9px 14px;
      background:#141c2c; border:1px solid var(--line); border-radius:10px;
      color:var(--text); cursor:pointer; font-size:13px;
      transition:border-color .15s, background .15s, box-shadow .15s;
    }
    .diff-btn b{ font-size:14px; letter-spacing:.3px; }
    .diff-btn small{ color:var(--dim); font-size:11px; font-weight:600; }
    .diff-btn:hover{ border-color:#54688c; }
    .diff-btn.sel{
      border-color:var(--gold); background:#1b2334;
      box-shadow:0 0 14px rgba(245,197,66,.18);
    }
    #ovMaps{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:16px 0 4px; }
    .map-btn{
      display:flex; flex-direction:column; align-items:center; gap:5px;
      padding:6px; background:#141c2c; border:1px solid var(--line); border-radius:10px;
      cursor:pointer; font-family:inherit;
      transition:border-color .15s, box-shadow .15s, background .15s;
    }
    .map-btn canvas{ display:block; width:144px; height:90px; border-radius:6px; background:#0e1320; }
    .map-btn .cap{ font-size:11px; color:var(--dim); font-weight:600; }
    .map-btn:hover{ border-color:#54688c; }
    .map-btn.sel{
      border-color:var(--gold); background:#1b2334;
      box-shadow:0 0 14px rgba(245,197,66,.18);
    }
    .map-btn.sel .cap{ color:var(--gold); }
    #ovExtra{ margin:16px 0 0; display:grid; grid-template-columns:repeat(2,minmax(160px,1fr)); gap:7px; text-align:left; }
   #ovExtra.hidden{ display:none; }
   #ovExtra .trow{
     display:flex; align-items:center; gap:9px; padding:7px 10px;
     background:rgba(255,255,255,.03); border:1px solid var(--line); border-radius:9px; font-size:13px;
   }
   #ovExtra .trow .chip{ width:13px; height:13px; border-radius:4px; background:var(--c); box-shadow:0 0 8px var(--c); flex:none; }
   #ovExtra .trow .key{
     font-size:9px; font-weight:700; line-height:1; padding:2px 4.5px;
     border-radius:4px; background:#0d1322; border:1px solid #2b3a5c; color:var(--dim); flex:none;
   }
   #ovExtra .trow small{ color:var(--dim); margin-left:auto; font-size:11px; font-weight:600; }
   #ovSub{ color:var(--dim); font-size:13px; margin:14px 0 18px; }
  #ovBtn{
    background:linear-gradient(180deg,#2a7d44,#1d5a32); border:1px solid #3fa362; color:#eafff0;
    font-size:16px; font-weight:700; padding:11px 30px; border-radius:9px; cursor:pointer; letter-spacing:.5px;
  }
  #ovBtn:hover{ filter:brightness(1.15); }
  /* ---------- Responsive: phones & narrow tablets (stacked layout, canvas fits viewport) ---------- */
  @media (max-width:960px){
    body{ padding:8px; }
    header#hud{
      position:sticky; top:8px; z-index:20;
      border-bottom:1px solid var(--line); border-radius:12px;
    }
    main{ flex-direction:column; align-items:stretch; gap:10px; }
    #stage{ flex:none; align-self:center; width:auto; border:1px solid var(--line); border-radius:12px; }
    aside#panel{ flex:none; width:auto; height:auto; border:1px solid var(--line); border-radius:12px; overflow:visible; }
    #shop{ display:grid; grid-template-columns:1fr 1fr; }
    #info{ min-height:0; }
    #ovTitle{ font-size:26px; }
    #ovBox{ padding:20px 22px; }
    #ovMaps{ gap:7px; }
    .map-btn canvas{ width:112px; height:70px; }
    .map-btn .cap{ font-size:10px; }
  }
  @media (max-width:560px){
    header#hud{ font-size:13px; gap:6px; padding:8px 10px; }
    .brand{ font-size:13px; margin-right:4px; }
    .stat{ padding:4px 8px; }
    .stat b{ font-size:13px; }
    header button{ padding:7px 9px; font-size:12px; }
  }
</style>
</head>
<body>
<div id="wrap">
  <header id="hud">
    <div class="brand">
      <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M3 7.2l3.5 2.5L10 4.2l3.5 5.5L17 7.2l-1.4 7.3H4.4z"/></svg>
      Tower Defense
    </div>
    <div class="stat gold" id="goldBox">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10" cy="10" r="7"/><circle cx="10" cy="10" r="3" fill="currentColor" stroke="none"/></svg>
      <b id="gold">150</b>
    </div>
    <div class="stat lives" id="livesBox">
      <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M10 17.2C4.8 13.9 2.5 11.4 2.5 8.6c0-2.2 1.7-3.8 3.8-3.8 1.5 0 2.9.8 3.7 2.1.8-1.3 2.2-2.1 3.7-2.1 2.1 0 3.8 1.6 3.8 3.8 0 2.8-2.3 5.3-7.5 8.6z"/></svg>
      <b id="lives">20</b>
    </div>
    <div class="stat wave" id="waveBox">
      <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M5 2h1.6v16H5zM6.6 3h9.2l-2.4 3.4 2.4 3.4H6.6z"/></svg>
      <b id="wave">1 / 20</b>
    </div>
    <div class="stat dim" id="left">Ready</div>
    <div class="spacer"></div>
    <button id="send" class="primary">Send Wave 1</button>
    <button id="speed">1×</button>
    <button id="pause">Pause</button>
    <button id="mute" title="Toggle sound (M)" aria-label="Toggle sound">
      <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M3 8v4h3l4.5 4V4L6 8H3z"/><path d="M13.5 7.3a4.2 4.2 0 0 1 0 5.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
  </header>
  <main>
    <div id="stage">
      <canvas id="game" width="960" height="600"></canvas>
      <div id="overlay">
        <div id="ovBox">
          <h1 id="ovTitle">TOWER DEFENSE</h1>
          <div class="title-rule"></div>
          <p id="ovText">Waves of invaders are coming. Pick a map and difficulty, then build towers on the grass — never on the road. (←/→ switch map)</p>
          <div id="ovDiff"></div>
          <div id="ovMaps"></div>
          <div id="ovExtra"></div>
          <p id="ovSub">150 gold · 20 lives · 20 waves · sell refunds 70%</p>
          <button id="ovBtn">Start Game</button>
        </div>
      </div>
    </div>
    <aside id="panel">
      <div class="ph">Build Towers</div>
      <div id="shop"></div>
      <div class="ph">Details</div>
      <div id="info"></div>
    </aside>
  </main>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
